# Merges Dependabot's pull requests by itself once the required checks pass.
# Needs "Allow auto-merge" on, and `check` as a required status check on main:
# without that, GitHub merges at once instead of waiting.
name: dependabot-automerge
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash --match-head-commit "$SHA" "$URL"
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
