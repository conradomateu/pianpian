# On main: keeps a "release v0.x.y" pull request up to date (version + CHANGELOG from feat:/fix: commits).
# Merging it tags the version and creates the GitHub release; then the apps are built on Apple Silicon (app.yml)
# and windows-latest (windows.yml), their files are attached to that release, and each of the two then rebuilds
# the website (site.yml), whose download links are read from the latest release's files when it is built.
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: release-please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  app:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/app.yml
    # a called workflow can't ask for more than its caller allows: app.yml attaches the files (contents) and
    # rebuilds the website afterwards (actions), which the two permissions above do not cover
    permissions:
      contents: write
      actions: write
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  windows:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: write
      actions: write
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
