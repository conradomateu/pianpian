# Builds Pianpian for Windows (tools/build_app_windows.py, through dev.py build) on windows-latest:
# the PyInstaller onedir app, the per-user Inno Setup installer (no admin) and a zip. Called by
# release-please.yml for each release, which then gets Pianpian-Windows-Setup.exe (what people open)
# and Pianpian-Windows.zip attached; run it by hand (Actions → windows → Run workflow) to try a build:
# the files are kept as a workflow artifact for a week either way. Only the release job may write.
# Checks are ci.yml's job.
# Inno Setup 6 is preinstalled on the windows-latest runners.
name: windows
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"          # this uv.exe ships inside the app and installs every user's engine: keep it exact
      - run: python dev.py build
      - uses: actions/upload-artifact@v7
        with:
          name: Pianpian-Windows
          path: |
            dist/Pianpian-Windows-Setup.exe
            dist/Pianpian-Windows.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: inputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write          # to rebuild the website once the files are attached (as app.yml does for macOS)
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Pianpian-Windows
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ inputs.tag }}" Pianpian-Windows-Setup.exe Pianpian-Windows.zip --clobber
      - name: Rebuild the website (it reads the release's files when it is built, and this job may finish after app.yml's)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run site.yml --ref main
